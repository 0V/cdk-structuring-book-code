# OIDCトークンの発行とリポジトリ内容の読み取りだけを許可
permissions:
    id-token: write
    contents: read

jobs:
    deploy-dev:
        if: github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        environment: development

        steps:
            - uses: actions/checkout@v5

            - name: Configure AWS Credentials for Dev Account
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  # development Environment Secretから開発用ロールARNを取得
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: github-actions-development
                  aws-region: ap-northeast-1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: CDK Deploy
              run: npx cdk deploy --context env=dev --require-approval never --all

    deploy-prod:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: production

        steps:
            - uses: actions/checkout@v5

            - name: Configure AWS Credentials for Prod Account
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  # production Environment Secretから本番用ロールARNを取得
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  role-session-name: github-actions-production
                  aws-region: ap-northeast-1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: CDK Deploy
              run: npx cdk deploy --context env=prod --require-approval never --all
