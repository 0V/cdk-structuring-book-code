name: Deploy to Development

# developブランチへのpushをトリガーにする
on:
    push:
        branches: [develop]

# ワークフローに与える権限を最小限に絞る
permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            # リポジトリのコードをチェックアウト
            - name: Checkout code
              uses: actions/checkout@v5

            # CDK CLIを動かすためのNode.jsのセットアップ
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # CDKアプリ（Python）を動かすためのPythonのセットアップ
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # AWS認証情報の設定
            # 簡略化のためアクセスキーを使用。本番運用では後述のOIDC認証に置き換える
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ap-northeast-1

            # 依存関係のインストール（CDK CLIとCDKアプリの両方）
            - name: Install dependencies
              run: |
                  npm ci
                  pip install -r requirements.txt

            # CDKデプロイの実行
            - name: CDK Deploy
              run: npx cdk deploy --context env=dev --require-approval never --all
