name: Test and Deploy

on:
    push:
        branches: [develop, staging, main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            # CDK Synthでテンプレート生成を確認
            - name: CDK Synth
              run: npx cdk synth --context env=dev

            # ユニットテストの実行
            - name: Run Unit Tests
              run: pytest

            # cdk-nagによるセキュリティチェック
            - name: Run CDK Nag
              run: |
                  pip install cdk-nag
                  npx cdk synth --context env=dev --app "python app.py"

    # テストが成功した場合のみデプロイを実行
    deploy:
        needs: test # testジョブの完了を待つ
        runs-on: ubuntu-latest
        # ブランチに対応するGitHub Environmentを指定し、環境ごとのSecretsを参照する
        environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Set environment name
              id: set-env
              run: |
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                    echo "env_name=prod" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
                    echo "env_name=staging" >> "$GITHUB_OUTPUT"
                  else
                    echo "env_name=dev" >> "$GITHUB_OUTPUT"
                  fi

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ap-northeast-1

            - name: Install dependencies
              run: npm ci

            - name: CDK Deploy
              run: npx cdk deploy --context "env=${{ steps.set-env.outputs.env_name }}" --require-approval never --all
